name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/church-livestream-automation-WdTuu
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kawaiahao-stream/package-lock.json

      - name: Install dependencies
        working-directory: kawaiahao-stream
        run: npm ci

      - name: Remove API routes (incompatible with static export)
        working-directory: kawaiahao-stream
        run: rm -rf src/app/api

      - name: Build static site
        working-directory: kawaiahao-stream
        run: npm run build

      - name: Add .nojekyll
        run: touch kawaiahao-stream/out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: kawaiahao-stream/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
